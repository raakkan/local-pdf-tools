name: Desktop development artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm notices
      - run: node scripts/rust-notices.mjs ${{ matrix.target }}
      - run: pnpm --filter @localpdf/desktop build --target ${{ matrix.target }}
        env:
          VITE_REPOSITORY_URL: ${{ vars.REPOSITORY_URL }}
          VITE_SPONSOR_URL: ${{ vars.SPONSOR_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-development-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/
            THIRD_PARTY_NOTICES.txt
            NATIVE_THIRD_PARTY_NOTICES.txt
